name: Run Tests

on:
  push:
    branches: [ main, master, claude/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Emacs
      run: |
        sudo apt-get update
        sudo apt-get install -y emacs-nox

    - name: Run tests
      run: |
        chmod +x run-tests.sh
        ./run-tests.sh
